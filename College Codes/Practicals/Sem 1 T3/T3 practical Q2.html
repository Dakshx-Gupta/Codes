<!DOCTYPE html>
<head>
    <title>Q2</title>
</head>
<body>
    <script>
        var n = parseInt(window.prompt());
        // document.write(n);
        switch(n){
            case 1:
                document.write("Monday")
                break;
            case 2:
                document.write("Tuesday")
                break;
            case 3:
                document.write("Wednesday")
                break;
            case 6:
                document.write("Saturday")
                break;
        }
    </script>
</body>
</html>
