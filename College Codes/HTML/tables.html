<!DOCTYPE html>
<html>
    <head>
        <style>
            table { border-collapse: collapse; width: 60%;}
            th, td { border: 1px solid black; padding: 10px; text-align: center; }
            th {background-color: lightblue;}
            caption {font-weight: bold; font-size: large; margin: 10px;}
        </style>
    </head>
    <body>
        <table>
            <caption>GG</caption>
            <tr>
                <th>Sunday</th>
                <th>Monday</th>
                <th>Tuesday</th>
            </tr>
            <tr>
                <td>Closed</td>
                <td>9-10 A.M.</td>
                <td>10-11 A.M.</td>
            </tr>
        </table>
    </body>
</html>
